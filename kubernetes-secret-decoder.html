<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kubernetes Secret decoder</title>
</head>
<body>
<h1>Kubernetes Secret decoder</h1>
<p>Paste a Kubernetes Secret manifest (YAML or JSON). Everything runs locally in this page; no network requests or storage.</p>
<label for="input">Secret manifest</label><br>
<textarea id="input" rows="18" cols="100" spellcheck="false" placeholder="apiVersion: v1&#10;kind: Secret&#10;data:&#10;  PASSWORD: c2VjcmV0"></textarea><br>
<button id="decode">Decode</button> <button id="clear">Clear</button>
<p id="status" role="status"></p>
<label for="format">Output format</label>
<select id="format">
<option value="json">JSON</option>
<option value="env">.env</option>
<option value="text">Plain text</option>
</select>
<button id="copy">Copy output</button> <button id="download">Download output</button><br>
<label for="output">Decoded output</label><br>
<textarea id="output" rows="18" cols="100" spellcheck="false" readonly></textarea>
<script>
'use strict';
const $ = id => document.getElementById(id);
let decoded = null;
let notes = [];

function scalar(s) {
  s = s.trim();
  if (s.startsWith('"')) {
    try { return JSON.parse(s); } catch { throw new Error('Invalid double-quoted YAML value'); }
  }
  if (s.startsWith("'")) {
    if (!s.endsWith("'")) throw new Error('Invalid single-quoted YAML value');
    return s.slice(1, -1).replace(/''/g, "'");
  }
  return s.replace(/\s+#.*$/, '').trim();
}
function parseYaml(source) {
  const result = {data: {}, stringData: {}};
  const lines = source.replace(/\r\n?/g, '\n').split('\n');
  let section = null, sectionIndent = -1;
  for (let i = 0; i < lines.length; i++) {
    const line = lines[i], trimmed = line.trim();
    if (!trimmed || trimmed.startsWith('#') || trimmed === '---' || trimmed === '...') continue;
    const indent = line.match(/^ */)[0].length;
    if (/^\s*\t/.test(line)) throw new Error('Tabs in YAML indentation are unsupported (line ' + (i + 1) + ')');
    if (section && indent <= sectionIndent) section = null;
    if (!section) {
      const match = /^([\w-]+):\s*(.*)$/.exec(trimmed);
      if (indent === 0 && match && (match[1] === 'data' || match[1] === 'stringData')) {
        if (match[2] && match[2] !== '{}') throw new Error('Use indented entries under ' + match[1]);
        section = match[1]; sectionIndent = indent;
      }
      continue;
    }
    const match = /^\s*([^:#][^:]*?):(?:\s*(.*))?$/.exec(line);
    if (!match) throw new Error('Unsupported YAML entry on line ' + (i + 1));
    const key = scalar(match[1]);
    if (!key) throw new Error('Empty key on line ' + (i + 1));
    let value = (match[2] || '').trim();
    if (/^[|>][-+]?\s*(?:#.*)?$/.test(value)) {
      const folded = value[0] === '>';
      const chomp = value.slice(1, 2);
      const block = [];
      let blockIndent = null;
      while (i + 1 < lines.length) {
        const next = lines[i + 1], nextIndent = next.match(/^ */)[0].length;
        if (next.trim() && nextIndent <= indent) break;
        i++;
        if (next.trim() && blockIndent === null) blockIndent = nextIndent;
        block.push(next);
      }
      const width = blockIndent === null ? indent + 1 : blockIndent;
      const parts = block.map(x => x.trim() ? x.slice(width) : '');
      value = folded ? parts.join('\n').replace(/([^\n])\n([^\n])/g, '$1 $2') : parts.join('\n');
      value = value.replace(/\n+$/, '') + (chomp === '-' ? '' : '\n');
    } else {
      value = scalar(value);
    }
    if (Object.hasOwn(result[section], key)) throw new Error('Duplicate key: ' + key);
    result[section][key] = value;
  }
  return result;
}
function base64Bytes(value, key) {
  if (typeof value !== 'string') throw new Error('Base64 value for ' + key + ' must be a string');
  const clean = value.replace(/\s/g, '');
  if (!/^(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$/.test(clean))
    throw new Error('Invalid base64 for ' + key);
  const raw = atob(clean);
  return Uint8Array.from(raw, c => c.charCodeAt(0));
}
function parse(source) {
  let manifest;
  try { manifest = JSON.parse(source); }
  catch { manifest = parseYaml(source); }
  if (!manifest || typeof manifest !== 'object' || Array.isArray(manifest)) throw new Error('Expected a Secret object');
  const data = manifest.data || {}, stringData = manifest.stringData || {};
  if (typeof data !== 'object' || Array.isArray(data) || typeof stringData !== 'object' || Array.isArray(stringData))
    throw new Error('data and stringData must be objects');
  if (!Object.keys(data).length && !Object.keys(stringData).length) throw new Error('No data or stringData entries found');
  const values = Object.create(null), warnings = [];
  const utf8 = new TextDecoder('utf-8', {fatal: true});
  for (const [key, value] of Object.entries(data)) {
    const bytes = base64Bytes(value, key);
    try { values[key] = utf8.decode(bytes); }
    catch {
      values[key] = '[base64:' + value.replace(/\s/g, '') + ']';
      warnings.push(key + ' contains non-UTF-8 bytes; retained as a base64 marker.');
    }
  }
  for (const [key, value] of Object.entries(stringData)) {
    if (typeof value !== 'string') throw new Error('stringData value for ' + key + ' must be a string');
    values[key] = value;
  }
  return {values, warnings};
}
function envQuote(s) { return JSON.stringify(s); }
function render() {
  if (!decoded) return;
  const entries = Object.entries(decoded);
  const format = $('format').value;
  if (format === 'json') $('output').value = JSON.stringify(decoded, null, 2);
  if (format === 'env') {
    $('output').value = entries.map(([key, value]) => {
      if (!/^[A-Za-z_][A-Za-z0-9_]*$/.test(key)) {
        notes.push('Skipped ' + key + ': invalid environment variable name.');
        return null;
      }
      return key + '=' + envQuote(value);
    }).filter(x => x !== null).join('\n');
  }
  if (format === 'text') $('output').value = entries.map(([key, value]) => key + ':\n' + value).join('\n\n');
  $('status').textContent = Object.keys(decoded).length + ' value(s) decoded.' + (notes.length ? ' ' + [...new Set(notes)].join(' ') : '');
}
$('decode').addEventListener('click', () => {
  decoded = null; notes = []; $('output').value = '';
  try {
    const result = parse($('input').value.trim());
    decoded = result.values; notes = result.warnings; render();
  } catch (error) { $('status').textContent = 'Error: ' + error.message; }
});
$('format').addEventListener('change', () => { if (decoded) { notes = notes.filter(n => !n.startsWith('Skipped ')); render(); } });
$('clear').addEventListener('click', () => { $('input').value = ''; $('output').value = ''; $('status').textContent = ''; decoded = null; notes = []; });
$('copy').addEventListener('click', async () => {
  try { await navigator.clipboard.writeText($('output').value); $('status').textContent = 'Output copied.'; }
  catch { $('output').select(); $('status').textContent = 'Select and copy the output manually.'; }
});
$('download').addEventListener('click', () => {
  if (!decoded) return;
  const ext = {json: 'json', env: 'env', text: 'txt'}[$('format').value];
  const url = URL.createObjectURL(new Blob([$('output').value], {type: 'text/plain;charset=utf-8'}));
  const a = document.createElement('a'); a.href = url; a.download = 'decoded-secret.' + ext; a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
});
</script>
</body>
</html>
